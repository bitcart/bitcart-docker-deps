name: Publish Docker Images

on:
  push:
    tags:
      - "*/*"

permissions:
  contents: read

jobs:
  parse_tag:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.meta.outputs.node }}
      version: ${{ steps.meta.outputs.version }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - name: Parse tag
        id: meta
        run: |
          NODE="${GITHUB_REF_NAME%%/*}"
          VERSION="${GITHUB_REF_NAME#*/}"
          {
            echo "node=${NODE}"
            echo "version=${VERSION}"
            echo "repo=bitcart/${NODE,,}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: parse_tag
    name: build-${{ needs.parse_tag.outputs.node }}
    uses: bitcart/bitcart-actions/.github/workflows/build-docker-image.yml@master
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      dockerfile: ${{ needs.parse_tag.outputs.node }}/Dockerfile
      context: ${{ needs.parse_tag.outputs.node }}
      image-name: ${{ needs.parse_tag.outputs.repo }}
      tags: |
        type=raw,value=${{ needs.parse_tag.outputs.version }}
      dockerhub-user: ${{ vars.DOCKERHUB_USER }}
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
