name: Publish Docker Images

on:
  push:
    tags:
      - "*/*"

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  parse-tag:
    name: parse-tag
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repo: ${{ steps.meta.outputs.repo }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse tag
        id: meta
        run: .github/scripts/release-tags.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ needs.parse-tag.outputs.image }}
    uses: bitcart/bitcart-actions/.github/workflows/build-docker-image.yml@master
    needs: parse-tag
    with:
      dockerfile: ${{ needs.parse-tag.outputs.image }}/Dockerfile
      context: ${{ needs.parse-tag.outputs.image }}
      image-name: ${{ needs.parse-tag.outputs.repo }}
      tags: ${{ needs.parse-tag.outputs.tags }}
      dockerhub-user: ${{ vars.DOCKERHUB_USER }}
      dockerhub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

    permissions:
      contents: read
      packages: write # publishing to GHCR
      id-token: write # OIDC for provenance
      attestations: write # github attestations
      artifact-metadata: write # artifact storage metadata (recommended by actions/attest)
